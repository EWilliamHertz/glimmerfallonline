# Keeps a free-tier game server (e.g. Render) from sleeping while people play.
# Repo > Settings > Secrets and variables > Actions > Variables: add GAME_SERVER_URL (https://your-app.onrender.com)
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.GAME_SERVER_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.GAME_SERVER_URL }}/api/status" > /dev/null
